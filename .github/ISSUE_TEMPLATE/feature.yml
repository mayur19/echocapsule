    id: outcome
    attributes: { label: Desired outcome }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria }
    validations: { required: true }
  - type: textarea
    id: trust
    attributes: { label: Timing, privacy and key-handling considerations }
    validations: { required: true }

